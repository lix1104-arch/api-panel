<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover：让页面延伸到刘海屏安全区，配合 CSS 里的 env(safe-area-inset-*) 使用 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>存</title>

<!-- ==================== PWA / iOS「添加到主屏幕」meta 标签 ==================== -->
<!-- 允许网页以 standalone 模式运行：Safari 添加到主屏幕后隐藏地址栏和工具栏，看起来像原生 App -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- 状态栏样式：black-translucent 让页面内容延伸到状态栏下方（需自行用安全区 padding 避让） -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- 添加到主屏幕后显示的 App 名称 -->
<meta name="apple-mobile-web-app-title" content="存">
<!-- 状态栏 / 浏览器主题色 -->
<meta name="theme-color" content="#f3f5f8">
<!-- manifest 与图标由 JS 动态生成（data URL 内联，单文件零外部依赖），见 script 中的 initPWA() -->
<link rel="manifest" id="manifest-link">
<link rel="apple-touch-icon" id="apple-touch-icon" sizes="180x180">
<link rel="icon" id="favicon">

<style>
/* ==================== 主题变量（整体淡灰色调，降饱和、轻量感） ==================== */
:root{
  --bg:      #f3f5f8;                 /* 页面浅灰背景 */
  --card:    #ffffff;                 /* 卡片纯白 */
  --text:    #454b54;                 /* 主文字（淡灰，柔和不刺眼） */
  --text-2:  #949ba5;                 /* 次要文字 */
  --text-3:  #c3c9d1;                 /* 占位文字 */
  --blue:    #6b93b8;                 /* 灰蓝（操作按钮，降饱和） */
  --green:   #5fae72;                 /* 柔和绿（已签到） */
  --red:     #dd7a72;                 /* 柔和红（取消签到/删除） */
  --sep:     rgba(60,60,67,.08);      /* 发丝分割线（极淡） */
  --radius:  20px;                    /* 卡片圆角（大圆角，弱化硬朗感） */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg)}
body{
  min-height:100%;
  /* ui-rounded：iOS 上自动使用 SF 圆体，数字与英文更柔和；其余平台回退到系统字体 */
  font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  /* 极浅的顶部渐变，让背景不再是"一块死板灰" */
  background:linear-gradient(180deg,#eef2f7 0%,#f3f5f8 380px,#f3f5f8 100%);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation; /* 去掉 iOS 上双击缩放/点击延迟 */
}
.app{max-width:640px;margin:0 auto;padding:0 16px calc(44px + env(safe-area-inset-bottom,0px))}

/* ==================== 顶部大标题 + 新建按钮 ==================== */
.header{padding-top:calc(env(safe-area-inset-top,0px) + 30px);margin-bottom:20px}
.title-row{display:flex;align-items:center;justify-content:space-between}
.large-title{font-size:32px;font-weight:600;letter-spacing:-.2px;color:var(--text)}
.add-btn{
  flex-shrink:0;width:38px;height:38px;border:none;border-radius:50%;
  background:#e9edf2;color:#7d8590;
  font-size:20px;font-weight:500;line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .15s ease,background .18s;
  padding-bottom:2px; /* ＋ 号视觉居中 */
}
.add-btn:active{transform:scale(.9);background:#e1e6ed}
.subtitle{margin-top:7px;font-size:14px;color:var(--text-2);letter-spacing:.1px}

/* ==================== 卡片列表 ==================== */
#card-list{display:flex;flex-direction:column;gap:14px;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{
  background:var(--card);
  border-radius:var(--radius);
  /* 两层弥散阴影代替一层硬阴影：更轻、更柔、有空气感 */
  box-shadow:0 2px 6px rgba(30,45,62,.04),0 14px 34px rgba(30,45,62,.055);
  overflow:hidden;
  transition:box-shadow .2s ease;
}
/* 长按拖动中的卡片：抬起、加重阴影、更醒目 */
.card.dragging{
  z-index:10;
  box-shadow:0 10px 24px rgba(30,45,62,.16),0 30px 60px rgba(30,45,62,.18);
  cursor:grabbing;
}
/* 卡片主行：文字标题 + 域名 | 签到状态 | ··· 按钮（也是长按拖动的把手） */
.card-main{
  display:flex;align-items:center;gap:12px;
  padding:15px 16px;cursor:pointer;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none; /* 长按不选中文字、不弹系统菜单 */
  transition:background .18s;
}
.card-main:active{background:rgba(30,45,62,.035)} /* iOS 按压反馈（很淡） */
.site-info{flex:1;min-width:0}
.site-name{font-size:17px;font-weight:600}
.site-url{margin-top:2px;font-size:12px;color:var(--text-2);word-break:break-all}
/* 备注小标签：直接显示在卡片上，不用展开详情 */
.note-tag{
  display:inline-block;margin-top:5px;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:11px;line-height:1;padding:4px 9px;border-radius:999px;
  background:rgba(148,155,165,.10);color:var(--text-2);
}
.status{flex-shrink:0;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;cursor:pointer;transition:transform .15s ease}
.status:not(.nosign):active{transform:scale(.92)} /* 状态徽章可点击切换，给个轻按压反馈 */
.status.signed{color:var(--green);background:rgba(95,174,114,.12)}
.status.unsigned{color:var(--text-2);background:rgba(148,155,165,.10);font-weight:500}
.status.nosign{color:var(--text-3);background:rgba(148,155,165,.07);font-weight:500;cursor:default}
.more-btn{
  flex-shrink:0;width:32px;height:32px;border:none;border-radius:50%;
  background:#eef1f5;color:#a7aeb8;
  font-size:15px;font-weight:700;letter-spacing:1px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .28s ease,background .18s;
  padding-bottom:5px; /* 让 ··· 视觉上居中 */
}
.more-btn:active{background:#e7ebf0}
.card.expanded .more-btn{transform:rotate(90deg)} /* 展开时按钮旋转 90°，作为状态提示 */

/* ==================== 卡片详情区（max-height 过渡实现平滑展开/收起） ==================== */
.card-details{max-height:0;overflow:hidden;transition:max-height .32s ease}
.details-inner{border-top:.5px solid var(--sep);padding:4px 16px 16px}
.detail-row{display:flex;align-items:center;gap:10px;min-height:44px}
.detail-row + .detail-row{border-top:.5px solid var(--sep)}
.detail-label{flex-shrink:0;font-size:15px;color:var(--text-2)}
.detail-value{flex:1;font-size:15px;word-break:break-all}
.detail-value.empty{color:var(--text-3)}
.row-btn{
  flex-shrink:0;border:none;border-radius:999px;
  background:rgba(107,147,184,.13);color:var(--blue);
  font-size:13px;font-weight:600;padding:6px 14px;
  cursor:pointer;transition:transform .15s ease,opacity .15s;font-family:inherit;
}
.row-btn:active{transform:scale(.94);opacity:.7} /* 轻弹性按压反馈 */

/* ---- iOS 风格小开关（详情区「无签到」行、新建弹窗共用） ---- */
.switch{
  position:relative;flex-shrink:0;width:44px;height:26px;
  background:rgba(120,120,128,.25);border-radius:999px;cursor:pointer;
  transition:background .2s ease;
}
.switch.on{background:var(--green)}
.switch::after{
  content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;
  background:#fff;border-radius:50%;
  box-shadow:0 1px 3px rgba(0,0,0,.18);
  transition:left .2s ease;
}
.switch.on::after{left:21px}

/* ---- 密钥区块：小标题 + 紧凑列表，视觉上独立于上面两个 ---- */
.keys-block{margin-top:6px;border-top:.5px solid var(--sep)}
.keys-head{display:flex;align-items:center;justify-content:space-between;min-height:38px}
.keys-title{font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:.3px}
.keys-add{
  border:none;background:transparent;color:var(--blue);
  font-size:13px;font-weight:600;padding:5px 8px;border-radius:8px;
  cursor:pointer;transition:opacity .15s;font-family:inherit;
}
.keys-add:active{opacity:.6}
.key-row{display:flex;align-items:center;gap:8px;padding:5px 0;min-height:40px}
.key-row + .key-row{border-top:.5px solid var(--sep)}
.key-info{flex:1;min-width:0}
.key-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key-masked{
  font-size:12px;color:var(--text-2);margin-top:1px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.key-btn{
  flex-shrink:0;border:none;border-radius:999px;
  font-size:12px;font-weight:600;padding:4px 11px;
  cursor:pointer;transition:transform .15s ease,opacity .15s;font-family:inherit;
}
/* 复制按钮：小图标样式（替代文字，更省空间）；删除按钮保持文字 */
.key-btn.copy{
  background:rgba(107,147,184,.13);color:var(--blue);
  width:28px;height:28px;padding:0;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
}
.key-btn.copy svg{width:13px;height:13px;display:block}
.key-btn.del{background:rgba(221,122,114,.10);color:var(--red)}
.key-btn:active{transform:scale(.94);opacity:.7}

/* ---- 详情区底部操作：取消签到 / 删除站点 并排，节省纵向空间 ---- */
.detail-actions{display:flex;gap:8px;margin-top:10px}
.act-btn{
  flex:1;border:none;border-radius:14px;
  font-size:14px;font-weight:600;padding:11px;
  cursor:pointer;transition:transform .15s ease,opacity .15s;font-family:inherit;
}
.act-btn.edit{background:rgba(107,147,184,.13);color:var(--blue)}
.act-btn.danger{background:rgba(148,155,165,.10);color:var(--red)}
.act-btn:active{transform:scale(.98);opacity:.7}

/* 空列表提示 */
.empty-tip{padding:22px 16px;text-align:center;color:var(--text-2);font-size:14px}

/* 底部提示 */
.footer-hint{margin-top:22px;text-align:center;font-size:12px;color:var(--text-3)}

/* ==================== iOS 风格弹窗（新建 / 修改 / 添加密钥 / 确认 / 导出导入 共用） ==================== */
/* 所有弹窗统一只使用单行 <input>，界面整洁 */
.modal-mask{
  position:fixed;inset:0;z-index:100;
  background:rgba(45,55,70,.35);
  display:flex;align-items:center;justify-content:center;padding:32px;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.modal-mask.show{opacity:1;pointer-events:auto}
.modal{
  width:284px;text-align:center;
  background:rgba(250,250,252,.96);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-radius:18px;overflow:hidden;
  transform:scale(.92);transition:transform .28s cubic-bezier(.34,1.4,.64,1); /* 微弹动画 */
}
.modal-mask.show .modal{transform:scale(1)}
.modal-title{font-size:16px;font-weight:600;padding:18px 16px 0}
.modal-msg{
  display:none;padding:10px 20px 0;font-size:14px;line-height:1.55;
  color:var(--text-2);word-break:break-all;
}
.modal-msg.show{display:block}
.modal-input{
  display:block;width:calc(100% - 32px);margin:12px auto 0;
  padding:8px 10px;font-size:16px;font-family:inherit; /* 16px 可避免 iOS 聚焦时页面缩放 */
  border:none;border-radius:10px;
  background:rgba(120,120,128,.10);color:var(--text);outline:none;
}
.modal-input:focus{background:rgba(120,120,128,.16)}
.modal-input + .modal-input{margin-top:8px} /* 需要两个输入框的弹窗（新建站点 / 添加密钥） */
/* 新建弹窗里的「无签到」开关行 */
.modal-toggle{display:flex;align-items:center;justify-content:space-between;width:calc(100% - 32px);margin:14px auto 0;padding:0 2px}
.modal-toggle-text{font-size:14px;color:var(--text-2)}
.hidden{display:none}
.modal-actions{display:flex;margin-top:16px;border-top:.5px solid var(--sep)}
.modal-actions button{
  flex:1;padding:12px;font-size:16px;font-family:inherit;
  background:transparent;border:none;color:var(--blue);cursor:pointer;
}
.modal-actions button + button{border-left:.5px solid var(--sep);font-weight:600}
.modal-actions button.danger{color:var(--red)} /* 删除确认按钮为红色 */
.modal-actions button:active{background:rgba(0,0,0,.05)}

/* ==================== 底部：导出 / 导入数据 ==================== */
.data-actions{display:flex;gap:10px;margin-top:24px}
.data-btn{
  flex:1;border:none;border-radius:14px;
  background:rgba(148,155,165,.10);color:var(--text-2);
  font-size:14px;font-weight:600;padding:11px;cursor:pointer;
  transition:transform .15s ease,opacity .15s;font-family:inherit;
}
.data-btn:active{transform:scale(.98);opacity:.7}

/* ==================== 轻提示 Toast ==================== */
.toast{
  position:fixed;left:50%;bottom:calc(44px + env(safe-area-inset-bottom,0px));z-index:200;
  transform:translateX(-50%) translateY(10px);
  background:rgba(62,68,76,.92);color:#fff;
  font-size:14px;padding:9px 18px;border-radius:999px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="title-row">
      <h1 class="large-title">存</h1>
      <button type="button" class="add-btn" id="add-btn" aria-label="新建站点">＋</button>
    </div>
    <p class="subtitle" id="subtitle">—</p>
  </header>

  <main id="card-list"><!-- 卡片由 JS 根据站点列表渲染 --></main>

  <div class="data-actions">
    <button type="button" class="data-btn" id="export-btn">导出数据</button>
    <button type="button" class="data-btn" id="import-btn">导入数据</button>
  </div>

  <p class="footer-hint">点击卡片打开站点并签到 · 点状态徽章切换已签/未签 · 长按卡片可拖动排序</p>
</div>

<!-- iOS 风格弹窗：所有弹窗共用，只包含单行 <input>，不再有 textarea -->
<div class="modal-mask" id="modal-mask">
  <div class="modal">
    <div class="modal-title" id="modal-title">修改</div>
    <div class="modal-msg" id="modal-msg"></div>
    <input class="modal-input hidden" id="modal-input" type="text" autocomplete="off" spellcheck="false">
    <input class="modal-input hidden" id="modal-input2" type="text" autocomplete="off" spellcheck="false">
    <div class="modal-toggle hidden" id="modal-toggle">
      <span class="modal-toggle-text" id="modal-toggle-text">无签到站点</span>
      <div class="switch" id="modal-switch" role="switch" aria-label="无签到"></div>
    </div>
    <div class="modal-actions">
      <button type="button" id="modal-cancel">取消</button>
      <button type="button" id="modal-ok">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ================================================================
 * ① 站点列表（初始配置 + 运行时管理）
 * ----------------------------------------------------------------
 * 下面的数组只作为【第一次打开页面】时的初始站点列表。
 * 之后的一切管理——新建、删除、长按拖动排序——都在界面上完成，
 * 并自动保存到 localStorage 的 apiPanel.sites，优先于这里的配置。
 * 备注 / 密钥在卡片详情里维护；想重新以这里的配置初始化：
 * 删除 localStorage 中的 apiPanel.sites 后刷新页面即可。
 * 注意：id 必须唯一，它是 localStorage 中数据的主键；界面上新建的
 * 站点会自动生成不冲突的 id。
 * 每个站点有两类地址，相互独立、互不影响：
 *   url —— 网址：点击卡片打开的站点、卡片名字下方显示（「修改网址」按钮）；
 *   api —— URL：API 端点，新建站点时默认 = 网址 + /v1（详情区「URL」行）。
 * ================================================================ */
const STORAGE_KEY_SITES = 'apiPanel.sites';

// 读取已保存的站点列表；没有（首次使用）则返回 null，由调用方使用默认配置
function loadSites() {
  try {
    const saved = JSON.parse(storageGet(STORAGE_KEY_SITES));
    if (Array.isArray(saved) && saved.length && saved.every(s => s && s.id && s.name)) return saved;
  } catch (e) {}
  return null;
}

let sites = loadSites() || [
  { id: "site1", name: "清酒", url: "https://qingjiu.nemodesk.top" },
  { id: "site2", name: "Noir",  url: "https://noir.blacknoir.cn" }
];

/* ================================================================
 * ② 存储层（localStorage，带内存兜底）
 * ----------------------------------------------------------------
 * localStorage 中的数据结构：
 *   apiPanel.sites    -> 站点列表（含顺序）：
 *        [ { id:"site1", name:"清酒",
 *            url:"https://…"（网址：卡片点击打开、名字下显示）,
 *            api:"https://…/v1"（URL：API 端点，与网址独立）,
 *            nosign:true（可选：无签到站点，不参与签到） }, … ]
 *   apiPanel.lastDate -> "2026-10-24"        最后一次使用的日期
 *   apiPanel.state    -> 每个站点的状态：
 *        {
 *          "site1": {
 *            signedDate: "2026-10-24" | null,       最近一次签到日期
 *            note:       "备注文字",                 备注
 *            keys:       [ { name:"密钥名称",        该站点的密钥列表
 *                            value:"sk-xxxx" } ]
 *          },
 *          "site2": { ... }
 *        }
 * 站点是否"今日已签"由 signedDate === 今天 推导得出。
 * ================================================================ */
const STORAGE_KEY_STATE    = 'apiPanel.state';
const STORAGE_KEY_LASTDATE = 'apiPanel.lastDate';

// 隐私模式 / 沙盒环境下 localStorage 可能不可用，降级为内存对象（页面关闭即丢失）
const memoryStore = {};
function storageGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return key in memoryStore ? memoryStore[key] : null; }
}
function storageSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { memoryStore[key] = value; }
}

// 站点列表（顺序）持久化
function saveSites() {
  storageSet(STORAGE_KEY_SITES, JSON.stringify(sites));
}

// 全部站点状态（内存中的工作副本），任何修改后调用 saveState() 持久化
let state = {};

function loadState() {
  try { state = JSON.parse(storageGet(STORAGE_KEY_STATE)) || {}; }
  catch (e) { state = {}; }
  if (typeof state !== 'object' || state === null) state = {};
  // 规范化旧数据：只保留已知字段（url 仅供启动迁移旧数据用，迁移后删除）
  Object.keys(state).forEach(k => {
    const r = state[k] || {};
    state[k] = {
      signedDate: r.signedDate || null,
      note:       r.note || '',
      url:        r.url || '',
      keys:       Array.isArray(r.keys) ? r.keys : []
    };
  });
}
function saveState() {
  storageSet(STORAGE_KEY_STATE, JSON.stringify(state));
}

// 读取某个站点的状态记录；没有则按默认值创建
function getStateOf(siteId) {
  if (!state[siteId]) state[siteId] = { signedDate: null, note: '', keys: [] };
  return state[siteId];
}

// 网址（site.url）：点击卡片打开的站点地址，卡片名字下方显示
function getSiteURL(site) { return site.url; }

// URL（site.api）：API 端点，与网址相互独立；异常缺省时回退为「网址 + /v1」
function getSiteAPI(site) { return site.api || withV1(normalizeURL(site.url)); }

// 给地址补 /v1：已以 /v1 结尾则原样返回（顺带去掉尾部斜杠）
function withV1(u) {
  return /\/v1$/i.test(u) ? u : u.replace(/\/+$/, '') + '/v1';
}

// 地址补全：没有 http(s):// 前缀时自动加上 https://
function normalizeURL(u) {
  return /^https?:\/\//i.test(u) ? u : 'https://' + u;
}

/* ================================================================
 * ③ 每日自动刷新逻辑（关键）
 * ----------------------------------------------------------------
 * 页面每次加载（以及从后台切回前台）时执行：
 *  - 取出 localStorage 里保存的"最后使用日期"；
 *  - 若与今天（本地时区的 YYYY-MM-DD）不一致，说明已经跨天
 *    （过了凌晨 12 点），自动清空所有站点的签到状态，并把该日期
 *    更新为今天。这样每天第一次打开面板，所有卡片都恢复为"未签"。
 * ================================================================ */
function getToday() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function dailyReset() {
  const today = getToday();
  if (storageGet(STORAGE_KEY_LASTDATE) !== today) {
    // 跨天了：清空所有站点的签到状态
    Object.keys(state).forEach(id => { state[id].signedDate = null; });
    storageSet(STORAGE_KEY_LASTDATE, today);
    saveState();
    return true; // 有变化，需要重绘界面
  }
  return false;
}

// 某条记录是否为"今日已签"
function isSigned(rec) { return !!rec.signedDate && rec.signedDate === getToday(); }

/* ================================================================
 * ④ 渲染
 * ================================================================ */
const listEl     = document.getElementById('card-list');
const subtitleEl = document.getElementById('subtitle');
const expanded   = new Set(); // 当前处于展开详情状态的站点 id

// 防 HTML 注入：用户输入（地址、备注、密钥等）渲染前先转义
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}
// 站点域名小字：去掉协议头和末尾斜杠，纯展示用
function shortURL(u) { return u.replace(/^https?:\/\//, '').replace(/\/$/, ''); }

// 复制按钮的小图标（内联 SVG，随按钮文字色着色）
const COPY_ICON =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<rect x="9" y="9" width="13" height="13" rx="2"></rect>' +
  '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>' +
  '</svg>';

// 密钥打码展示：保留首尾各几位，中间用 *** 代替（如 sk-ab***7890）
function maskKey(v) {
  const s = String(v);
  if (s.length <= 8) return s.slice(0, 2) + '***' + s.slice(-2);
  return s.slice(0, 5) + '***' + s.slice(-4);
}

// 详情行：传 copyValue 时加「复制」按钮（与密钥同款样式、同一点击逻辑），
// 传 field 时加「修改」按钮；两个都传则同时显示（URL 行：复制 + 修改）
function rowHTML(label, value, field, copyValue) {
  const empty = value === undefined || value === null || String(value).trim() === '';
  let btn = '';
  if (copyValue !== undefined)
    btn += '<button type="button" class="key-btn copy" data-key="' + esc(copyValue) + '" aria-label="复制">' + COPY_ICON + '</button>';
  if (field)
    btn += '<button type="button" class="row-btn" data-field="' + field + '">修改</button>';
  return '<div class="detail-row">' +
           '<span class="detail-label">' + label + '：</span>' +
           '<span class="detail-value' + (empty ? ' empty' : '') + '">' + (empty ? '—' : esc(value)) + '</span>' +
           btn +
         '</div>';
}

// 密钥区块：小标题（含数量）+ 添加按钮 + 紧凑的密钥行列表
function keysSectionHTML(site, rec) {
  const keys = Array.isArray(rec.keys) ? rec.keys : [];
  const rows = keys.map((k, i) =>
    '<div class="key-row">' +
      '<div class="key-info">' +
        '<div class="key-name">' + esc(k.name) + '</div>' +
        '<div class="key-masked">' + esc(maskKey(k.value)) + '</div>' +
      '</div>' +
      // 复制按钮为小图标；完整密钥放在 data-key 上供点击读取（已做 HTML 转义）
      '<button type="button" class="key-btn copy" data-key="' + esc(k.value) + '" aria-label="复制">' + COPY_ICON + '</button>' +
      '<button type="button" class="key-btn del" data-index="' + i + '">删除</button>' +
    '</div>'
  ).join('');
  return '<div class="keys-block">' +
           '<div class="keys-head">' +
             '<span class="keys-title">密钥（' + keys.length + '）</span>' +
             '<button type="button" class="keys-add">＋ 添加密钥</button>' +
           '</div>' +
           (keys.length ? '<div class="key-list">' + rows + '</div>' : '') +
         '</div>';
}

function render() {
  listEl.innerHTML = '';

  if (sites.length === 0) {
    listEl.innerHTML = '<div class="card"><div class="empty-tip">还没有站点，点击右上角「＋」新建一个吧</div></div>';
  }

  for (const site of sites) {
    const rec    = getStateOf(site.id);
    const signed = isSigned(rec);
    const url    = getSiteURL(site); // 网址（点击卡片打开、名字下显示）
    const api    = getSiteAPI(site); // URL：API 端点（与网址独立，默认 网址+/v1）

    const card = document.createElement('div');
    card.className = 'card' + (expanded.has(site.id) ? ' expanded' : '');
    card.dataset.id = site.id;

    // —— 主行：文字标题 + 域名 | 签到状态 | ··· 按钮 ——
    const main = document.createElement('div');
    main.className = 'card-main';
    main.innerHTML =
      '<div class="site-info">' +
        '<div class="site-name">' + esc(site.name) + '</div>' +
        '<div class="site-url">' + esc(shortURL(url)) + '</div>' +
        // 有备注时，在卡片上直接显示小标签（不用展开详情）
        (String(rec.note || '').trim() ? '<div class="note-tag">' + esc(rec.note) + '</div>' : '') +
      '</div>' +
      // 无签到站点显示灰色「无签到」徽章（不可点）；否则正常 已签/未签
      (site.nosign
        ? '<div class="status nosign">无签到</div>'
        : signed
          ? '<div class="status signed">✓已签</div>'
          : '<div class="status unsigned">未签</div>') +
      '<button type="button" class="more-btn" aria-label="展开或收起详情">···</button>';
    card.appendChild(main);

    // —— 详情区：地址 / 备注 / 密钥列表 / 底部操作（并排，避免臃肿） ——
    const details = document.createElement('div');
    details.className = 'card-details';
    const inner = document.createElement('div');
    inner.className = 'details-inner';
    inner.innerHTML =
      rowHTML('URL', api, 'api', api) +         // URL（API 端点）：显示 + 复制图标 + 行内修改，与网址独立
      rowHTML('备注', rec.note, 'note') +
      // 无签到开关行：随时可以把站点设为无签到 / 恢复签到
      '<div class="detail-row">' +
        '<span class="detail-label">无签到</span>' +
        '<span class="detail-value"></span>' +
        '<div class="switch' + (site.nosign ? ' on' : '') + '" data-action="nosign" role="switch" aria-label="无签到"></div>' +
      '</div>' +
      keysSectionHTML(site, rec) +
      '<div class="detail-actions">' +
        // 原「取消今日签到」的位置改为修改网址；签到状态直接点徽章切换
        '<button type="button" class="act-btn edit">修改网址</button>' +
        '<button type="button" class="act-btn danger">删除站点</button>' +
      '</div>';
    details.appendChild(inner);
    card.appendChild(details);

    listEl.appendChild(card);

    // 页面重绘时，原本已展开的卡片直接设置高度（跳过动画，避免闪动）
    if (expanded.has(site.id)) {
      details.style.transition = 'none';
      details.style.maxHeight  = inner.scrollHeight + 'px';
      void details.offsetHeight; // 强制浏览器立即应用无动画高度
      details.style.transition = '';
    }
  }

  // 副标题：日期 + 签到统计（无签到站点单独计数提示）
  const d = new Date();
  const weeks = ['日','一','二','三','四','五','六'];
  const signedCount  = sites.filter(s => !s.nosign && isSigned(getStateOf(s.id))).length;
  const nosignCount  = sites.filter(s => s.nosign).length;
  subtitleEl.textContent =
    (d.getMonth() + 1) + '月' + d.getDate() + '日 星期' + weeks[d.getDay()] +
    ' · 共 ' + sites.length + ' 个站点，已签 ' + signedCount + ' 个' +
    (nosignCount ? ' · ' + nosignCount + ' 个无签到' : '');
}

/* ================================================================
 * ⑤ 交互逻辑
 * ================================================================ */

// 事件统一委托到列表容器上
listEl.addEventListener('click', e => {
  if (suppressClick) return; // 拖动刚结束，吞掉结尾误触的 click
  const card = e.target.closest('.card');
  if (!card) return;
  const site = sites.find(s => s.id === card.dataset.id);
  if (!site) return;

  // （a）点击「···」：展开 / 收起详情（不触发签到）
  if (e.target.closest('.more-btn')) { toggleExpand(card); return; }

  // （b）点击「修改」：弹出修改弹窗（地址 / 备注）
  const editBtn = e.target.closest('.row-btn');
  if (editBtn) { openEditDialog(site, editBtn.dataset.field); return; }

  // （c）点击密钥的「复制」：完整密钥写入剪贴板
  const copyBtn = e.target.closest('.key-btn.copy');
  if (copyBtn) { copyKey(copyBtn.dataset.key); return; }

  // （d）点击密钥的「删除」
  const keyDelBtn = e.target.closest('.key-btn.del');
  if (keyDelBtn) { deleteKey(site, Number(keyDelBtn.dataset.index)); return; }

  // （e）点击「＋ 添加密钥」
  if (e.target.closest('.keys-add')) { openAddKeyDialog(site); return; }

  // （e2）点击详情里的「无签到」开关：切换该站点是否参与签到
  if (e.target.closest('.switch[data-action="nosign"]')) { toggleNoSign(site); return; }

  // （f）点击签到状态徽章：手动切换 已签 ⇄ 未签（不打开站点）；无签到站点给出提示
  if (e.target.closest('.status')) {
    if (site.nosign) { toast('该站点已设为无签到，详情中可切换'); return; }
    toggleSign(site.id); return;
  }

  // （g）点击「修改网址」：弹出网址修改弹窗（原「取消签到」的位置）
  if (e.target.closest('.act-btn.edit')) { openEditDialog(site, 'url'); return; }

  // （h）点击「删除站点」：二次确认后删除该站点
  if (e.target.closest('.act-btn.danger')) { openDeleteConfirm(site); return; }

  // （i）详情区的其余空白位置：什么都不做
  if (e.target.closest('.card-details')) return;

  // （j）点击卡片主体：【关键逻辑】新窗口打开站点 + 立刻标记今日已签
  signSite(site);
});

// 展开 / 收起详情：通过把 max-height 设为内容实际高度来实现平滑过渡
function toggleExpand(card) {
  const id      = card.dataset.id;
  const details = card.querySelector('.card-details');
  if (expanded.has(id)) {
    expanded.delete(id);
    card.classList.remove('expanded');
    details.style.maxHeight = '0px'; // 平滑收起
  } else {
    expanded.add(id);
    card.classList.add('expanded');
    details.style.maxHeight = details.scrollHeight + 'px'; // 平滑展开
  }
}

/* 签到：先尝试新窗口打开站点（使用当前生效地址），再立刻把
 * signedDate 写成今天并刷新 UI。即使弹窗被浏览器拦截，签到状态
 * 也已生效（按需求：点击即标记）。无签到站点只打开、不标记。 */
function signSite(site) {
  const win = window.open(getSiteURL(site), '_blank');
  if (win) win.opener = null; // 安全：切断新窗口对本页面的引用
  else toast('弹窗被拦截，请允许弹出窗口后重试');
  if (site.nosign) return;    // 无签到站点：到此为止

  const rec = getStateOf(site.id);
  rec.signedDate = getToday(); // 标记今日已签（取消签到时会被清空）
  saveState();                 // 日期 + 状态写入 localStorage
  render();                    // 更新 UI：显示绿色 ✓已签
}

// 切换站点的「无签到」状态；开启时顺带清掉今日签到记录
function toggleNoSign(site) {
  site.nosign = !site.nosign;
  if (site.nosign) getStateOf(site.id).signedDate = null;
  saveSites();
  saveState();
  render();
  toast(site.nosign ? '已设为无签到' : '已恢复签到');
}

// 点击状态徽章切换签到：已签 → 取消，未签 → 标记为今日已签（不打开站点）
function toggleSign(siteId) {
  const rec = getStateOf(siteId);
  if (isSigned(rec)) {
    rec.signedDate = null;
    saveState();
    render();
    toast('已取消签到');
  } else {
    rec.signedDate = getToday();
    saveState();
    render();
    toast('已标记为已签');
  }
}

/* ================================================================
 * ⑤-B 长按拖动排序（长按卡片约 0.35 秒进入拖动；触屏和鼠标都支持）
 * ----------------------------------------------------------------
 * 原理：pointerdown 后启动计时器，期间移动超过阈值视为滚动并取消；
 * 计时结束进入拖动——卡片跟随手指（translateY），当它的中心越过
 * 相邻卡片的中点时实时交换 DOM 顺序，松手后把 DOM 顺序写回 sites
 * 数组并持久化。
 * ================================================================ */
let drag = null;           // 当前拖动状态；null 表示空闲
let suppressClick = false; // 拖动结束时吞掉结尾产生的 click，避免误签到
const LONG_PRESS_MS = 350; // 长按触发时长

listEl.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;                          // 只响应左键 / 触摸
  const main = e.target.closest('.card-main');
  if (!main || e.target.closest('.more-btn')) return;  // ··· 按钮不参与拖动
  const card = main.closest('.card');
  drag = {
    card: card,
    pointerId: e.pointerId,
    startX: e.clientX, startY: e.clientY,
    curY: e.clientY,
    started: false, timer: null, origOrder: null
  };
  // 长按计时：按住不动达到 LONG_PRESS_MS 才进入拖动
  drag.timer = setTimeout(startDrag, LONG_PRESS_MS);
});

function startDrag() {
  if (!drag) return;
  drag.started = true;
  drag.origOrder = sites.map(s => s.id);      // 记录初始顺序，结束时判断是否真的变化
  drag.card.classList.add('dragging');        // 抬起效果
  suppressClick = true;                       // 拖完后紧接着的 click 不触发签到
  if (navigator.vibrate) navigator.vibrate(10); // 触觉反馈（部分安卓支持）
  requestAnimationFrame(dragFrame);           // 启动边缘自动滚动循环
}

window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pointerId) return;
  // 长按生效前的移动：判定为滚动页面，取消长按
  if (!drag.started) {
    if (Math.abs(e.clientY - drag.startY) > 12 || Math.abs(e.clientX - drag.startX) > 12) {
      clearTimeout(drag.timer);
      drag = null;
    }
    return;
  }
  drag.curY = e.clientY;
  applyDragTransform();
  reorderDuringDrag();
});

// 松手 / 系统打断（如来电、滚动接管）时结束拖动
function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.pointerId)) return;
  clearTimeout(drag.timer);
  if (drag.started) {
    drag.card.classList.remove('dragging');
    drag.card.style.transform = '';
    // 按 DOM 顺序把新顺序写回 sites 并持久化
    const order   = [...listEl.querySelectorAll('.card')].map(c => c.dataset.id);
    const changed = order.join() !== drag.origOrder.join();
    if (changed) {
      sites.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
      saveSites();
      render();
      toast('顺序已保存');
    }
    setTimeout(() => { suppressClick = false; }, 300);
  }
  drag = null;
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

// 拖动进行中阻止页面触摸滚动（passive:false 才能 preventDefault）
document.addEventListener('touchmove', e => {
  if (drag && drag.started) e.preventDefault();
}, { passive: false });

// 长按不弹系统菜单（iOS / Android）
listEl.addEventListener('contextmenu', e => {
  if (e.target.closest('.card-main')) e.preventDefault();
});

// 鼠标滚轮在拖动中滚动页面时，同步补偿卡片位置
window.addEventListener('wheel', e => {
  if (drag && drag.started) {
    drag.startY -= e.deltaY;
    applyDragTransform();
    reorderDuringDrag();
  }
}, { passive: true });

function applyDragTransform() {
  drag.card.style.transform = 'translateY(' + (drag.curY - drag.startY) + 'px)';
}

// 拖动时根据卡片中心与相邻卡片中点比较，实时交换 DOM 顺序
function reorderDuringDrag() {
  const rect = drag.card.getBoundingClientRect();
  const midY = rect.top + rect.height / 2;
  const next = drag.card.nextElementSibling;
  const prev = drag.card.previousElementSibling;
  if (next) {
    const r = next.getBoundingClientRect();
    if (midY > r.top + r.height / 2) return shiftCard(() => next.after(drag.card));
  }
  if (prev) {
    const r = prev.getBoundingClientRect();
    if (midY < r.top + r.height / 2) return shiftCard(() => prev.before(drag.card));
  }
}

// DOM 位置变化后补偿 translateY，让卡片在手指下保持视觉连续
function shiftCard(domMove) {
  const oldTop = drag.card.getBoundingClientRect().top;
  domMove();
  const newTop = drag.card.getBoundingClientRect().top;
  drag.startY += newTop - oldTop;
  applyDragTransform();
}

// 拖到屏幕上下边缘时自动滚动列表
function dragFrame() {
  if (!drag || !drag.started) return;
  const vh = window.innerHeight;
  let scroll = 0;
  if (drag.curY < 90)                        scroll = -Math.min(12, (90 - drag.curY) / 3);
  else if (drag.curY > vh - 90)              scroll =  Math.min(12, (drag.curY - (vh - 90)) / 3);
  if (scroll) {
    window.scrollBy(0, scroll);
    drag.startY -= scroll; // 页面滚动后补偿，卡片继续贴着手指
    applyDragTransform();
    reorderDuringDrag();
  }
  requestAnimationFrame(dragFrame);
}

/* ================================================================
 * ⑥ iOS 风格弹窗（新建 / 修改 / 添加密钥 / 删除确认 / 导出导入 共用）
 * ----------------------------------------------------------------
 * 所有弹窗统一只使用单行 <input>（最多两个），没有任何 textarea。
 * ================================================================ */
const maskEl   = document.getElementById('modal-mask');
const titleEl  = document.getElementById('modal-title');
const msgEl    = document.getElementById('modal-msg');
const inputEl  = document.getElementById('modal-input');
const input2El = document.getElementById('modal-input2');
const toggleRowEl = document.getElementById('modal-toggle');
const toggleTextEl = document.getElementById('modal-toggle-text');
const modalSwitchEl = document.getElementById('modal-switch');
const okBtn    = document.getElementById('modal-ok');
let dialogSave = null; // 点击"保存/确认"时执行的回调；返回 false 表示校验未通过，弹窗保持打开

// 通用弹窗：inputs 为 [{value, placeholder, inputmode, readonly}]（最多两个），message 用于确认型弹窗
function showModal(opts) {
  titleEl.textContent = opts.title;
  msgEl.textContent   = opts.message || '';
  msgEl.classList.toggle('show', !!opts.message);
  const inputs = opts.inputs || [];
  // 「无签到」开关行：仅传入 opts.toggle 的弹窗（新建站点）显示
  const toggleConf = opts.toggle;
  toggleRowEl.classList.toggle('hidden', !toggleConf);
  if (toggleConf) {
    toggleTextEl.textContent = toggleConf.label || '';
    modalSwitchEl.classList.toggle('on', !!toggleConf.value);
  }
  [inputEl, input2El].forEach((el, i) => {
    const conf = inputs[i];
    el.classList.toggle('hidden', !conf);
    if (conf) {
      el.value = conf.value || '';
      el.placeholder = conf.placeholder || '';
      el.setAttribute('inputmode', conf.inputmode || 'text');
      el.readOnly = !!conf.readonly;
    }
  });
  okBtn.textContent = opts.confirmLabel || '保存';
  okBtn.classList.toggle('danger', !!opts.danger);
  dialogSave = opts.onSave || null;
  maskEl.classList.add('show');
  // 等弹窗动画结束再聚焦；只读的导出输入框自动全选，方便直接复制
  if (inputs.length) setTimeout(() => { inputEl.focus(); if (inputs[0].readonly) inputEl.select(); }, 240);
}

function closeModal() {
  maskEl.classList.remove('show');
  inputEl.blur();
  input2El.blur();
  dialogSave = null;
}

// 修改弹窗：网址（site.url，卡片打开的站点）与 URL（site.api，API 端点）独立编辑
function openEditDialog(site, field) {
  const rec = getStateOf(site.id);
  const isNote = field === 'note';
  const isAPI  = field === 'api';

  showModal({
    title: isNote ? '修改备注' : isAPI ? '修改 URL' : '修改网址',
    inputs: [isNote
      ? { value: rec.note, placeholder: '输入备注' }
      : isAPI
        ? { value: getSiteAPI(site), placeholder: 'https://…/v1', inputmode: 'url' }
        : { value: site.url, placeholder: 'https://…', inputmode: 'url' }],
    onSave: () => {
      const v = inputEl.value.trim();
      if (isNote) {
        rec.note = v;
        saveState();
        render();
        toast('已保存');
        return;
      }
      if (!v) {
        // 网址是必填；URL 清空保存 = 恢复默认（网址 + /v1）
        if (isAPI) { site.api = ''; saveSites(); render(); toast('已恢复默认 URL'); return; }
        toast('请输入网址');
        return false; // 校验不通过，弹窗保持打开
      }
      if (isAPI) site.api = normalizeURL(v);
      else       site.url = normalizeURL(v);
      saveSites(); // 网址 / URL 都直接保存在站点上
      render();
      toast('已保存');
    }
  });
}

// 新建站点：填写名称 + 地址
function openCreateDialog() {
  showModal({
    title: '新建站点',
    inputs: [
      { value: '', placeholder: '站点名称' },
      { value: '', placeholder: 'https://（网址）', inputmode: 'url' }
    ],
    // 「无签到」开关：默认关闭（正常签到）；开启后该站点不参与签到
    toggle: { label: '无签到站点', value: false },
    confirmLabel: '添加',
    onSave: () => {
      const name   = inputEl.value.trim();
      const rawURL = input2El.value.trim();
      if (!name)   { toast('请填写站点名称'); return false; } // 校验不通过，弹窗保持打开
      if (!rawURL) { toast('请填写网址'); return false; }
      const url = normalizeURL(rawURL);                     // 网址原样保存（不加 /v1）
      const api = withV1(url);                              // URL（API 端点）= 网址 + /v1
      const id = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); // 自动生成唯一 id
      sites.push({
        id: id, name: name, url: url, api: api,
        nosign: modalSwitchEl.classList.contains('on')      // 读取开关状态
      });
      saveSites();
      render();
      toast('已添加「' + name + '」');
      setTimeout(() => { // 滚动到底部，让新卡片进入视野
        const last = listEl.lastElementChild;
        if (last) last.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 120);
    }
  });
}

// 添加密钥：填写名称 + 内容
function openAddKeyDialog(site) {
  const rec = getStateOf(site.id);
  showModal({
    title: '添加密钥',
    inputs: [
      { value: '', placeholder: '密钥名称（如：主力 Key）' },
      { value: '', placeholder: '密钥内容（如：sk-xxxx）' }
    ],
    confirmLabel: '添加',
    onSave: () => {
      const name  = inputEl.value.trim();
      const value = input2El.value.trim();
      if (!name)  { toast('请填写密钥名称'); return false; } // 校验不通过，弹窗保持打开
      if (!value) { toast('请填写密钥内容'); return false; }
      if (!Array.isArray(rec.keys)) rec.keys = [];
      rec.keys.push({ name: name, value: value }); // 数据结构：{ name, value }
      saveState();
      render();
      toast('已添加密钥「' + name + '」');
    }
  });
}

// 复制密钥完整内容：先同步走临时 input + execCommand（在点按手势内成功率最高），
// 失败再尝试 Clipboard API
function copyKey(value) {
  const done = ok => toast(ok ? '密钥已复制' : '复制失败');
  if (fallbackCopy(value)) { done(true); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(value).then(() => done(true), () => done(false));
  } else {
    done(false);
  }
}

// 复制兜底方案：创建一个屏外的单行 input，选中后 execCommand('copy')
function fallbackCopy(text) {
  try {
    const tmp = document.createElement('input');
    tmp.value = text;
    tmp.style.position = 'fixed';
    tmp.style.opacity = '0';
    document.body.appendChild(tmp);
    tmp.focus();
    tmp.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(tmp);
    return ok;
  } catch (e) { return false; }
}

// 删除密钥（按索引，直接删除并提示）
function deleteKey(site, index) {
  const rec = getStateOf(site.id);
  if (!Array.isArray(rec.keys) || !rec.keys[index]) return;
  const name = rec.keys[index].name;
  rec.keys.splice(index, 1);
  saveState();
  render();
  toast('已删除密钥「' + name + '」');
}

// 删除站点（二次确认）
function openDeleteConfirm(site) {
  showModal({
    title: '删除站点',
    message: '确定删除「' + site.name + '」吗？它的备注、密钥等数据将一并清除。',
    confirmLabel: '删除',
    danger: true,
    onSave: () => {
      const i = sites.findIndex(s => s.id === site.id);
      if (i > -1) sites.splice(i, 1);
      delete state[site.id]; // 一并清除该站点的本地数据
      expanded.delete(site.id);
      saveSites();
      saveState();
      render();
      toast('已删除「' + site.name + '」');
    }
  });
}

/* ================================================================
 * 导出 / 导入数据
 * ----------------------------------------------------------------
 * 导出：把站点列表（含顺序）、每个站点的签到日期 / 备注 / 自定义
 *       地址 / 密钥列表、最后使用日期，打包成一份单行 JSON 文本，
 *       放进只读的单行输入框（自动全选），点"复制"写入剪贴板。
 * 导入：粘贴之前导出的 JSON，校验通过后【整体替换】当前数据；
 *       若备份的日期早于今天，会按"跨天"规则清掉过期签到状态。
 * ================================================================ */
function buildExportJSON() {
  // 只导出已知字段，保证数据干净（不含任何历史遗留字段）
  const cleanState = {};
  Object.keys(state).forEach(k => {
    const r = state[k] || {};
    cleanState[k] = {
      signedDate: r.signedDate || null,
      note:       r.note || '',
      keys:       Array.isArray(r.keys) ? r.keys : []
    };
  });
  return JSON.stringify({
    app: 'api-panel',                                        // 标识数据来源，导入时校验用
    version: 3,
    exportedAt: new Date().toLocaleString(),
    sites: sites,                                            // 站点列表（含顺序、网址 url 与 API 端点 api）
    state: cleanState,                                       // 各站点的签到 / 备注 / 密钥
    lastDate: storageGet(STORAGE_KEY_LASTDATE) || getToday() // 最后使用日期
  });
}

// 打开导出弹窗：单行只读输入框展示 JSON（自动全选），点"复制"写入剪贴板
function openExportDialog() {
  const json = buildExportJSON();
  showModal({
    title: '导出数据',
    inputs: [{ value: json, readonly: true }],
    confirmLabel: '复制',
    onSave: () => {
      const ok = fallbackCopy(inputEl.value);
      const fail = () => toast('复制失败，请手动全选复制');
      if (ok) { toast('已复制到剪贴板'); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(inputEl.value).then(() => toast('已复制到剪贴板'), fail);
      } else fail();
    }
  });
}

// 打开导入弹窗：单行输入框粘贴 JSON，校验通过后整体替换当前数据
function openImportDialog() {
  showModal({
    title: '导入数据',
    inputs: [{ value: '', placeholder: '粘贴之前导出的 JSON 文本…' }],
    confirmLabel: '导入',
    onSave: () => {
      const raw = inputEl.value.trim();
      if (!raw) { toast('请先粘贴 JSON 文本'); return false; }
      let data;
      try { data = JSON.parse(raw); }
      catch (e) { toast('JSON 格式错误，无法导入'); return false; }
      if (!data || typeof data !== 'object' || data.app !== 'api-panel' ||
          !Array.isArray(data.sites) || !data.state || typeof data.state !== 'object') {
        toast('数据结构不对，请确认是本应用导出的 JSON');
        return false;
      }
      // 清洗站点列表：必须有 id/name，id 重复的只保留第一个。
      // 兼容旧版备份（v2 及更早）：网址曾存在 state[k].url 里、且没有 api 字段
      const seen = new Set();
      const clean = [];
      data.sites.forEach(s => {
        if (s && s.id && s.name && !seen.has(String(s.id))) {
          seen.add(String(s.id));
          const st = data.state[s.id] || {};
          let u = normalizeURL(String(s.url || ''));
          if (st.url) u = normalizeURL(String(st.url));     // 旧版：网址覆盖值存在 state 里
          clean.push({
            id: String(s.id),
            name: String(s.name),
            url: u,
            api: s.api ? normalizeURL(String(s.api)) : withV1(u), // 无 api 的老数据按 网址+/v1 生成
            nosign: !!s.nosign                                 // 无签到标记一并保留
          });
        }
      });
      if (!clean.length) { toast('没有可导入的站点'); return false; }
      // 整体替换站点列表与状态（状态中不属于站点列表的条目丢弃）
      sites = clean;
      const known = new Set(sites.map(s => s.id));
      state = {};
      Object.keys(data.state).forEach(k => {
        if (!known.has(k)) return;
        const r = data.state[k] || {};
        state[k] = {
          signedDate: r.signedDate || null,
          note:       String(r.note || ''),
          keys:       Array.isArray(r.keys)
            ? r.keys.filter(k => k && k.name && k.value)
                    .map(k => ({ name: String(k.name), value: String(k.value) }))
            : []
        };
      });
      expanded.clear();
      saveSites();
      saveState();
      storageSet(STORAGE_KEY_LASTDATE, data.lastDate || getToday());
      dailyReset(); // 若导入的是更早的备份，按跨天规则清掉过期签到
      render();
      toast('导入成功，共 ' + sites.length + ' 个站点');
    }
  });
}

document.getElementById('add-btn').addEventListener('click', openCreateDialog);
document.getElementById('export-btn').addEventListener('click', openExportDialog);
document.getElementById('import-btn').addEventListener('click', openImportDialog);

okBtn.addEventListener('click', () => {
  if (!dialogSave) { closeModal(); return; }
  if (dialogSave() === false) return; // 校验未通过，弹窗保持打开
  closeModal();
});
document.getElementById('modal-cancel').addEventListener('click', closeModal);
modalSwitchEl.addEventListener('click', () => modalSwitchEl.classList.toggle('on')); // 开关自身切换
maskEl.addEventListener('click', e => { if (e.target === maskEl) closeModal(); }); // 点遮罩关闭
[inputEl, input2El].forEach(el => el.addEventListener('keydown', e => {
  if (e.key === 'Enter')  okBtn.click(); // 回车 = 保存
  if (e.key === 'Escape') closeModal();  // Esc = 取消
}));

/* ==================== 轻提示 ==================== */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

/* ================================================================
 * ⑦ PWA 初始化：canvas 动态生成图标 + 内联 manifest（单文件方案）
 * ----------------------------------------------------------------
 * Safari「添加到主屏幕」主要依赖上方 apple-* meta 标签；这里用
 * canvas 画一个 180×180 图标（data URL），manifest 也以 data URL
 * 内联，做到零外部文件。
 * 若想换成自己的图标：把 <link id="apple-touch-icon"> 的 href 改成
 * 图片地址即可（建议 180×180 PNG；iOS 对 data URL 图标支持不一，
 * 若主屏幕图标显示为页面截图，换成同目录下的真实图片文件最稳妥）。
 * ================================================================ */
function initPWA() {
  try {
    // 1. 画图标：淡灰蓝渐变底 + "存" 字
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 180;
    const ctx = canvas.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 180, 180);
    g.addColorStop(0, '#8ca4ba');
    g.addColorStop(1, '#b9c9d8');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 180, 180);
    ctx.fillStyle = 'rgba(255,255,255,.97)';
    ctx.font = '600 92px -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(60,80,100,.22)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 2;
    ctx.fillText('存', 90, 96);

    const iconURL = canvas.toDataURL('image/png');
    document.getElementById('apple-touch-icon').href = iconURL;
    document.getElementById('favicon').href = iconURL;

    // 2. 内联 manifest（data URL）
    const manifest = {
      name: '存',
      short_name: '存',
      display: 'standalone',
      start_url: '.',
      background_color: '#f3f5f8',
      theme_color: '#f3f5f8',
      icons: [{ src: iconURL, sizes: '180x180', type: 'image/png' }]
    };
    document.getElementById('manifest-link').href =
      'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
  } catch (e) { /* 图标生成失败不影响主功能 */ }
}

/* ==================== 启动流程 ==================== */
loadState();    // 1. 读取 localStorage 里的站点状态（顺带规范化旧数据、清除废弃字段）
// 2. 数据迁移：旧版把「修改过的网址」存在 state[k].url，现在网址直接保存在
//    站点上；同时为没有 api（URL）的老站点按「网址 + /v1」补一个
sites.forEach(s => {
  const rec = state[s.id];
  if (rec && 'url' in rec) {          // 旧版字段：有值则搬回站点，然后彻底移除
    if (rec.url) s.url = rec.url;
    delete rec.url;
  }
  if (!s.api) s.api = withV1(normalizeURL(s.url));
});
saveState();    //（迁移后把清理过的状态也写回）
saveSites();    // 3. 把当前站点列表持久化（首次运行即写入，之后以界面管理为准）
dailyReset();   // 4. 每日自动刷新（关键）：跨天则清空所有签到状态
render();       // 5. 渲染卡片列表
initPWA();      // 6. 生成 PWA 图标与 manifest

// 面板一直开着跨过凌晨的情况：从后台切回前台时再检查一次日期
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && dailyReset()) render();
});
</script>
